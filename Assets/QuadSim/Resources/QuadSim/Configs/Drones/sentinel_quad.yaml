name: "ModalAI_Sentinel_RB5_S500"

body_mesh: "/QuadSimPlugin/Assets/Drone_Models/Sentinel/Sentinel.Sentinel"

physical_properties:
  mass_kg: 1.347
  com_offset: {x: 0.0, y: 0.0, z: 0.02}
  inertia: {x: 0.02817, y: 0.02817, z: 0.04383}
  arm_length: 0.236
  linear_drag_coef: 0.15
  angular_drag_coef: 0.08

propulsion:
  prop_diameter: 0.254

  # Gazebo maxRotVelocity = 1095 rad/s
  max_rpm: 10456.48

  # motorConstant * maxRotVelocity^2
  # 1.075e-5 * 1095^2 = 12.8895 N per motor
  max_thrust: 12.88952

  # Converted from Gazebo's T = motorConstant * omega^2
  # into QuadSim's T = Ct * rho * n^2 * D^4 convention.
  thrust_coef: 0.0832333

  # Gazebo momentConstant is Q/T in meters—not the dimensionless Cq.
  # Cq = momentConstant * Ct / D
  torque_coef: 0.00498089

  # QuadSim convention: -1 = CCW, +1 = CW.
  # SDF: motors 0/1 CCW and motors 2/3 CW.
  propellers:
    - {id: 0, x:  0.167, y: 0.0, z:  0.167, dir: -1}
    - {id: 1, x:  0.167, y: 0.0, z: -0.167, dir: -1}
    - {id: 2, x: -0.167, y: 0.0, z:  0.167, dir:  1}
    - {id: 3, x: -0.167, y: 0.0, z: -0.167, dir:  1}

controller:

  position_gains:
    x: {p: 0.95, i: 0.0, d: 0.0}
    y: {p: 0.95, i: 0.0, d: 0.0}
    z: {p: 1.0, i: 0.0, d: 0.0}

  velocity_gains:
    x: {p: 3.0, i: 0.1, d: 0.0}
    y: {p: 3.0, i: 0.1, d: 0.0}
    z: {p: 8.0, i: 2.0, d: 0.0}

  attitude_gains:
    roll:  {p: 5.5, i: 0.0, d: 0.0}
    pitch: {p: 5.5, i: 0.0, d: 0.0}

  rate_gains:
    roll:  {p: 0.08, i: 0.4, d: 0.0}
    pitch: {p: 0.08, i: 0.4, d: 0.0}
    yaw:   {p: 0.13, i: 0.3, d: 0.0}

camera_parameters:
  Cam_Arm_Length: 2.5
  FOV: 90
  Cam_Pitch: -15.0
  Cam_Socket_Offset:
    x: -5.0
    y: 0.0
    z: 2.0

limits:
  max_velocity_xy: 3.0
  max_velocity_z: 1.12
  max_tilt_angle_deg: 30.0
  max_angular_rate_RP_deg: 150.0
  max_angular_rate_Yaw_deg: 150.0

  # Per-motor maximum, matching propulsion.max_thrust
  max_thrust_newtons: 12.88952

  max_pid_output: 700.0
  acceptable_distance: 5