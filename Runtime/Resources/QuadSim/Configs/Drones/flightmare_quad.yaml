# Drone Configuration File - Flightmare quadrotor
#
# Sources (uzh-rpg/flightmare master d4218ae, flightlib):
#   [F1] src/dynamics/quadrotor_dynamics.cpp: t_BM_, J_, thrust_max_,
#        getAllocationMatrix(), motorOmegaToThrust()
#   [F2] configs/quadrotor_env.yaml: mass 0.73, arm_l 0.17, motor_omega_max
#        3000, motor_tau 0.0001, thrust_map, kappa 0.016
#   [F3] src/objects/quadrotor.cpp: run(), runMotors()
# Not from Flightmare: prop_diameter (QuadSim parameterization only), body
# mesh, camera, controller gains and limits.
schema_version: 1
prefab_key: flightmare_quad
name: "Flightmare_Quad"
body_mesh: "/QuadSimPlugin/Assets/Drone_Models/QuadRotor1/Quadrotor1.Quadrotor1"
physical_properties:
  mass_kg: 0.73
  # Flightmare has no center-of-mass offset [F1].
  com_offset: {x: 0.0, y: 0.0, z: 0.0}
  # Flightmare J = mass/12 * arm_l^2 * diag(4.5, 4.5, 7) [F1]
  # = (0.00791, 0.00791, 0.01231) in body FLU.
  # Unity axes are X-forward, Y-up, Z-left, so yaw (Jzz) goes on y.
  inertia: {x: 0.00791, y: 0.01231, z: 0.00791}
  arm_length: 0.17
  # Flightmare integrates no aerodynamic drag on the body [F3].
  linear_drag_coef: 0.0
  angular_drag_coef: 0.0

propulsion:
  # Flightmare thrust per motor is a*w^2 + b*w + c (thrust_map [F2]),
  # clamped to [0, thrust_max_]. thrust_max_ is set once in the constructor
  # from motor_omega_max = 2000 and updateParams() never recomputes it, so the
  # yaml's 3000 only clamps w: the effective ceiling is
  # a*2000^2 + b*2000 + c = 11.2225 N per motor [F1].
  # QuadSim models T = Tmax * (w/wmax)^2 and cannot represent the b*w + c
  # terms; it matches Flightmare at zero and at maximum thrust only.
  # w is read as rad/s (the yaml comment says rpm, but 738 rpm hover would be
  # implausible), so wmax = 2000 rad/s = 19098.59 rpm. prop_diameter is not
  # a Flightmare value, so thrust_coef is a fit, not a physical Ct.
  prop_diameter: 0.127
  max_rpm: 19098.59
  max_thrust: 11.2225
  thrust_coef: 0.347566
  # Flightmare kappa = 0.016 m (yaw torque = kappa * thrust) [F2]. QuadSim reads a
  # dimensionless coefficient, so torque_coef = kappa * 2.5*pi * thrust_coef / prop_diameter.
  torque_coef: 0.343909
  torque_coefficient_convention: legacy_2_5_pi
  # Flightmare motor_tau = 0.0001 s [F2]: no lag at a 250 Hz step, so no
  # motor time constants are set here.

  # Symmetric X, every rotor at arm_l * sqrt(0.5) = 0.120208 m in x and y [F1].
  # Flightmare simulates torques from B_allocation_ [F3], whose roll/pitch
  # rows are t_BM_.topRows<2>() and yaw row kappa*(1,-1,1,-1) [F1]. That puts
  # Flightmare motors 0,1,2,3 at FL, FR, BR, BL (not the FR, BR, BL, FL that
  # t_BM_ itself lists), with FL/BR producing counter-clockwise body yaw.
  # QuadSim order FL, FR, BL, BR = Flightmare motors 0, 1, 3, 2.
  # dir is the reactive body-yaw sign (-1 = CCW, +1 = CW).
  propellers:
    - {id: 0, x:  0.120208, y: 0.0, z:  0.120208, dir: -1}  # FL = Flightmare 0
    - {id: 1, x:  0.120208, y: 0.0, z: -0.120208, dir:  1}  # FR = Flightmare 1
    - {id: 2, x: -0.120208, y: 0.0, z:  0.120208, dir:  1}  # BL = Flightmare 3
    - {id: 3, x: -0.120208, y: 0.0, z: -0.120208, dir: -1}  # BR = Flightmare 2

runtime:
  physics_rate_hz: 250
  controller_rate_hz: 250

controller:
  position_gains:
    x: {p: 1.0, i: 0.0, d: 0.0}
    y: {p: 1.0, i: 0.0, d: 0.0}
    z: {p: 1.0, i: 0.1, d: 0.0}
  
  velocity_gains:
    x: {p: 3.0, i: 0.01, d: 0.0001}
    y: {p: 3.0, i: 0.01, d: 0.0001}
    z: {p: 5.0, i: 0.0, d: 0.0}
  
  attitude_gains:
    roll:  {p: 6.0, i: 0.0, d: 0.0}
    pitch: {p: 6.0, i: 0.0, d: 0.0}
    yaw:   {p: 2.5, i: 0.0, d: 0.0}

  # Output is angular acceleration (deg/s^2) per rate error (deg/s): p in 1/s, i in 1/s^2, d unitless.
  rate_gains:
    roll:  {p: 394.9, i: 22.57, d: 0.1128}
    pitch: {p: 253.7, i: 14.5, d: 0.0725}
    # 564 1/s (the exact conversion of the old gain) is above what a 250 Hz
    # loop supports (P*dt > 2) and limit-cycles once yaw authority is correct.
    yaw:   {p: 10.0, i: 0.0, d: 0.0}

camera_parameters:
  Cam_Arm_Length: 0.9          # meters, orbit/follow distance
  FOV: 65.0                    # clamped 20..140
  Cam_Pitch: -0.0             # degrees, clamped -80..80
  Cam_Socket_Offset: {x: 0.0, y: 0.0, z: 20.0}   # NOTE: cm, and UE axis order
    
limits:
  # Flightmare sets no velocity or tilt limit; these are QuadSim choices.
  max_velocity_xy: 8.0
  max_velocity_z: 10.0
  max_tilt_angle_deg: 45.0
  # Flightmare omega_max = 6 rad/s on every body axis [F2].
  max_angular_rate_RP_deg: 343.775
  max_angular_rate_Yaw_deg: 343.775
  # Total of four rotors at propulsion.max_thrust (schema: total-thrust limit).
  max_thrust_newtons: 44.89
  max_pid_output: 700.0
  acceptable_distance: 5
