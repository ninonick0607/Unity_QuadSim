# Drone Configuration File - ModalAI Sentinel (Holybro S500 V2 frame)
#
# Sources:
#   [M1] docs.modalai.com/sentinel-functional-description: take-off weight
#        1347 g (1011 g without battery), 480 mm diagonal, Holybro
#        2216-880kv motors, 10 in / 254 mm propellers.
#   [M2] ModalAI voxl-px4-params (gitlab.com/voxl-public/voxl-sdk/utilities/
#        voxl-px4-params), params/v1.14/platforms/Sentinel_V1.params and
#        params/v1.18/D0006/Sentinel_V1_base.params (identical values):
#        CA_ROTOR*_PX/PY = +-0.17 m, CA_ROTOR*_KM = +-0.05, MPC_THR_HOVER 0.39,
#        THR_MDL_FAC 0.80, VOXL_ESC_CONFIG 1 (RPM control),
#        VOXL_ESC_RPM_MIN/MAX = 1000/7000, and the MPC_*/MC_* limits below.
#   [G]  Gazebo sentinel_base SDF (origin not public): inertia, motor time
#        constants. Its 1.347 kg base link already equals the full take-off
#        weight [M1], so its four rotor links double-count mass.
# No ModalAI source gives inertia or the yaw torque-to-thrust ratio.
# PX4's KM 0.05 is PX4's default allocation value, not a measurement.
schema_version: 1
prefab_key: sentinel_quad
name: "ModalAI_Sentinel_RB5_S500"

body_mesh: "/QuadSimPlugin/Assets/Drone_Models/Sentinel/Sentinel.Sentinel"

physical_properties:
  # Take-off weight with battery [M1].
  mass_kg: 1.347

  # QuadSim is one rigid body centered at the composed Gazebo center of mass.
  com_offset: {x: 0.0, y: 0.0, z: 0.0}

  # Gazebo composed inertia [G] about that center is FLU
  # (0.02383614, 0.02393907, 0.04399995). Unity axes are X-forward,
  # Y-up, Z-left, hence the Y/Z permutation here. It includes the
  # double-counted 0.064 kg of rotor links; kept until a measured value exists.
  inertia: {x: 0.02383614, y: 0.04399995, z: 0.02393907}
  # Half the 480 mm motor-to-motor diagonal [M1].
  arm_length: 0.24
  linear_drag_coef: 0.15
  angular_drag_coef: 0.08

propulsion:
  # 10 in propellers [M1].
  prop_diameter: 0.254

  # The ESC runs closed-loop RPM control with a 7000 rpm ceiling [M2].
  max_rpm: 7000

  # PX4 hovers at 0.39 of maximum collective thrust [M2]:
  # 1.347 kg * 9.81 / 4 / 0.39 = 8.4706 N per motor (thrust-to-weight 2.56).
  # Cross-check: at 7000 rpm this needs Ct = 0.122, typical of a 10x4.5
  # propeller, and PX4's THR_MDL_FAC 0.80 curve maps 0.39 thrust to 4506 rpm.
  max_thrust: 8.4706
  thrust_coef: 0.122053

  # Yaw torque-to-thrust ratio kept at the previous plant value, 0.011773 m,
  # until a controlled PX4 yaw-rate sweep justifies changing it. torque_coef
  # changes only because thrust_coef changed:
  # torque_coef = 0.011773 * 2.5*pi * thrust_coef / prop_diameter.
  torque_coef: 0.044432
  torque_coefficient_convention: legacy_2_5_pi

  # Gazebo MulticopterMotorModel asymmetric response constants [G]. Like Gazebo,
  # QuadSim applies them to rotor speed, with thrust proportional to speed^2.
  motor_time_constant_up_s: 0.0125
  motor_time_constant_down_s: 0.025

  # QuadSim canonical order is FL, FR, BL, BR. Its physics applies dir as the
  # reactive body-yaw torque sign (-1=CCW, +1=CW), while Gazebo names the
  # rotor's own rotation. PX4 none_iris outputs are also remapped to this order
  # by px4_bridge.MOTOR_MAP, so Gazebo motor directions cannot be copied here.
  # Positions: 0.24 m / sqrt(2) = 0.1697 m [M1] (PX4 rounds to 0.17 [M2]).
  # Directions match [M2]: KM > 0 (CCW propeller) on FR and BL.
  propellers:
    - {id: 0, x:  0.1697, y: 0.0, z:  0.1697, dir: -1}
    - {id: 1, x:  0.1697, y: 0.0, z: -0.1697, dir:  1}
    - {id: 2, x: -0.1697, y: 0.0, z:  0.1697, dir:  1}
    - {id: 3, x: -0.1697, y: 0.0, z: -0.1697, dir: -1}

runtime:
  physics_rate_hz: 250
  controller_rate_hz: 250

controller:

  position_gains:
    x: {p: 0.95, i: 0.0, d: 0.0}
    y: {p: 0.95, i: 0.0, d: 0.0}
    z: {p: 1.0, i: 0.0, d: 0.0}

  velocity_gains:
    x: {p: 3.0, i: 0.1, d: 0.0}
    y: {p: 3.0, i: 0.1, d: 0.0}
    z: {p: 8.0, i: 2.0, d: 0.0}

  attitude_gains:
    roll:  {p: 5.5, i: 0.0, d: 0.0}
    pitch: {p: 5.5, i: 0.0, d: 0.0}
    yaw:   {p: 2.5, i: 0.0, d: 0.0}

  # Output is angular acceleration (deg/s^2) per rate error (deg/s): p in 1/s, i in 1/s^2, d unitless.
  rate_gains:
    roll:  {p: 16.52, i: 82.62, d: 0.0}
    pitch: {p: 16.45, i: 82.27, d: 0.0}
    yaw:   {p: 14.55, i: 33.57, d: 0.0}

camera_parameters:
  Cam_Arm_Length: 2.5
  FOV: 90
  Cam_Pitch: -15.0
  Cam_Socket_Offset:
    x: -5.0
    y: 0.0
    z: 2.0

limits:
  # Active "outdoor" block of [M2]: MPC_XY_VEL_MAX 5.0 (ModalAI [M1] also
  # states 5 m/s); the 3.0 "indoor" values are commented out there.
  max_velocity_xy: 5.0
  # PX4 allows 4.0 m/s up and 1.5 m/s down [M2]; QuadSim has one symmetric
  # z limit, so it takes the tighter descent value.
  max_velocity_z: 1.5
  # MPC_TILTMAX_AIR 30, MC_ROLLRATE/PITCHRATE/YAWRATE_MAX 150 [M2].
  max_tilt_angle_deg: 30.0
  max_angular_rate_RP_deg: 150.0
  max_angular_rate_Yaw_deg: 150.0

  # Total of four rotors at propulsion.max_thrust (schema: total-thrust limit).
  max_thrust_newtons: 33.88

  max_pid_output: 700.0
  acceptable_distance: 5
